<style>
:root{--bg:#05060a;--bg-1:#0a0c14;--border:#1a1f2e;--text:#e8eaf0;--text-muted:#6b7385;--neon-cyan:#00f0ff;--neon-magenta:#ff00aa;--neon-green:#39ff88;--font-mono:'Share Tech Mono',monospace;--font-display:'Orbitron',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);overflow:hidden;height:100dvh}
.rw-shell{display:flex;flex-direction:column;height:100dvh}
.rw-bar{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.2rem;background:linear-gradient(180deg,rgba(0,240,255,.07),transparent);border-bottom:1px solid var(--border);flex:0 0 auto}
.rw-back{font-family:var(--font-mono);font-size:.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:.35rem .9rem;transition:all .3s;white-space:nowrap}
.rw-back:hover{color:var(--neon-cyan);border-color:var(--neon-cyan);text-shadow:0 0 8px var(--neon-cyan)}
.rw-title{font-family:var(--font-display);font-size:.9rem;font-weight:700;color:var(--neon-cyan);letter-spacing:2px;text-shadow:0 0 10px rgba(0,240,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw-title span{color:var(--neon-magenta)}
.rw-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.rw-dot.g{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.rw-open{margin-left:auto;font-family:var(--font-mono);font-size:.72rem;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);border-radius:999px;padding:.35rem .9rem;transition:all .3s;white-space:nowrap}
.rw-open:hover{color:var(--neon-magenta);border-color:var(--neon-magenta);text-shadow:0 0 8px var(--neon-magenta)}
.rw-frame{flex:1 1 auto;min-height:0;position:relative;background:var(--bg-1)}
.rw-frame iframe{display:block;width:100%;height:100%;border:0}
@media(max-width:640px){
  .rw-bar{gap:.5rem;padding:.5rem .8rem}
  .rw-title{font-size:.78rem}
  .rw-back,.rw-open{font-size:.68rem;padding:.3rem .7rem}
}
</style>
</head>
<body>
<div class="rw-shell">
